<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
    name="description"
    content="Contact River Warriors for rafting reservations, trip information, questions, and customer support.">

    <meta name="author" content="Justin Celestin Stephane Mulumba">
    <title>Contact Us | River Warriors</title>
</head>
<body>

    <header>
        <img src="images/warriors.jpg" alt="River Warriors company logo">
        <nav>
           <a href="index.html">Home</a>
           <a href="about.html">About Us</a>
           <a href="trips.html">Trips</a>
           <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>
     <section class="contact-info">
        <h1>River Warriors</h1>
        <p>123 Main Street</p>
        <p>Beechwood Park, Newport</p>
        <p>+1 999 333 999</p>
        <p>info@riverwarriors.com</p>
     </section>   
     <section class="map-form">
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d34619.05407168885!2d-3.041629013209812!3d51.5891853010545!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4871e6f0a100e457%3A0x620f23ca6bd26c18!2sBeechwood%20Park!5e0!3m2!1sfr!2scg!4v1791415844282!5m2!1sfr!2scg" title="Location of the river warriors on Google maps" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <form>
            <h2>Contact Us</h2>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <p>Message Purpose</p>
            <label>
                <input type="radio" name="purpose" value="general" required>General Inquiry</label>
            <label>
                <input type="radio" name="purpose" value="reservation">Reservation Question</label>  
            <label>
                <input type="radio" name="purpose" value="website">Website Suggestion</label>
            <label for="message">Message</label>  
            <textarea id="message" name="message" rows="5" placeholder="Type Here"></textarea>
            <label>
                <input type="checkbox" name="newsletter">Please subscribe me to the monthly newsletter</label>
            <button type="submit">Get in touch!</button>    
        </form>
     </section>   
     <section class="employees">
        <h2>We Are Here to Serve You</h2>
        <div class="employees-grid">
            <figure>
                <img src="images/guide-employee.png" alt="Rafting guide seated on a red inflatable raft on a river">
                <figcaption>Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/trip-coordinators.png" alt="Trip coordinators preparing a rafting activity">
                <figcaption>Trip coordinators</figcaption>
            </figure>
            <figure>
                <img src="images/safety-employees.png" alt="Safety instructors assisting rafting participants">
                <figcaption>Safety Instructors</figcaption>
            </figure>
        </div>
      </section>   
    </main>
    <footer>
        <p>©2026 River Warriors | Justin Celestin Stephane Mulumba</p>

            <a href="https://www.facebook.com/share/14nkNg6rfA5/" target="_blank">

            </a>
            <a href="https://www.linkedin.com/in/stephane-lotshanga-mulumba-905601286?utm_source=share_via&utm_content=profile&utm_medium=member_android">
                <img src="images/linkedin-3991775.png" alt="LinkedIn">
            </a>
            <a href="https://whatsapp.com/channel/0029Vb9Jt1mFCCoWaLCdhR1K">
                <img src="images/whatsapp-3938041.png" alt="WhatsApp">
            </a>
        </nav>
    </footer>

</body>
